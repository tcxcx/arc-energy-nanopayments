[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 10000
isolate = false
libs = ["dependencies"]
# Test harnesses embed proxy, implementation, handler, and token creation code.
# Production bytecode limits are enforced separately with `forge build --sizes`.
code_size_limit = 100000

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 32
fail_on_revert = false
show_metrics = true

[profile.matrix.fuzz]
runs = 10000

[profile.matrix.invariant]
runs = 256
depth = 128
fail_on_revert = false
show_metrics = true

[dependencies]
openzeppelin-contracts = { version = "5.6.1", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.6.1" }
openzeppelin-contracts-upgradeable = { version = "5.6.1", git = "https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git", tag = "v5.6.1" }
forge-std = { version = "1.16.2", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.16.2" }

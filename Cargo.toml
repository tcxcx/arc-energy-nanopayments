[workspace]
resolver = "2"
members = [
    "crates/autarqia-primitives",
    "crates/autarqia-subsystem-api",
    "crates/autarqia-runtime",
    "crates/autarqia-store",
    "crates/autarqia-energy",
    "crates/autarqia-payments",
    "crates/autarqia-inference",
    "crates/autarqia-bufi",
    "crates/autarqia-nucleus",
    "crates/autarqia-rpc",
    "crates/autarqia-cli",
    "bins/autarqia-node",
]
exclude = [
    "node_modules",
    ".next",
    "workers",
    "data",
    "contracts",
    "out",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Autarqia Contributors"]

[workspace.dependencies]
autarqia-primitives = { path = "crates/autarqia-primitives" }
autarqia-subsystem-api = { path = "crates/autarqia-subsystem-api" }
autarqia-runtime = { path = "crates/autarqia-runtime" }
autarqia-store = { path = "crates/autarqia-store" }
autarqia-energy = { path = "crates/autarqia-energy" }
autarqia-payments = { path = "crates/autarqia-payments" }
autarqia-inference = { path = "crates/autarqia-inference" }
autarqia-bufi = { path = "crates/autarqia-bufi" }
autarqia-nucleus = { path = "crates/autarqia-nucleus" }
autarqia-rpc = { path = "crates/autarqia-rpc" }
autarqia-cli = { path = "crates/autarqia-cli" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"

tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.11", features = ["v4"] }
tempfile = "3.14"
hyper-util = { version = "0.1", features = ["tokio"] }
